<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b0b0b; color:#fff; margin:0; padding:24px; }
    .card { max-width:560px; margin:24px auto; background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:20px; }
    input,button,select { width:100%; box-sizing:border-box; margin-top:10px; padding:12px; border-radius:8px; border:1px solid #333; }
    input,select { background:#111; color:#fff; }
    button { background:#2563eb; color:#fff; border:none; cursor:pointer; }
    button.secondary { background:#374151; }
    .hidden { display:none; }
    .muted { color:#aaa; font-size:12px; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    label.field { display:block; margin-top:12px; font-size:12px; color:#aaa; }
    .head { display:flex; align-items:center; gap:10px; }
    .dot { width:10px; height:10px; border-radius:50%; background:#ef4444; flex:0 0 auto; }
    .dot.ok { background:#22c55e; }
    pre.logs { background:#0e0e0e; border:1px solid #262626; border-radius:8px; padding:10px; height:200px; overflow:auto; font-size:11px; white-space:pre-wrap; margin-top:12px; }
    .kv { font-size:12px; color:#ccc; margin-top:8px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="card" id="loginCard">
    <h2>Админ панель</h2>
    <p class="muted">Введите пароль администратора.</p>
    <input id="adminPassword" type="password" placeholder="Пароль" />
    <button onclick="verifyAdmin()">Войти</button>
    <p id="loginError" class="muted hidden" style="color:#f87171;">Неверный пароль</p>
  </div>

  <div class="card hidden" id="panelCard">
    <h2>Безопасность дашборда</h2>
    <label><input id="requirePin" type="checkbox" style="width:auto; margin-right:8px;">Требовать PIN для Index / Index Mini</label>
    <input id="dashboardPin" type="password" inputmode="numeric" placeholder="PIN-код" />
    <button onclick="savePinConfig()">Сохранить</button>
    <p id="saveStatus" class="muted"></p>
  </div>

  <div class="card hidden" id="bridgeCard">
    <div class="head">
      <span class="dot" id="bridgeDot"></span>
      <h2 style="margin:0;">Мост Tuya</h2>
    </div>
    <p class="muted" id="bridgeSummary">Загрузка…</p>

    <label class="field">TUYA_CLIENT_ID</label>
    <input id="k_TUYA_CLIENT_ID" />

    <label class="field">TUYA_CLIENT_SECRET (пустое поле = оставить текущий)</label>
    <input id="k_TUYA_CLIENT_SECRET" type="password" placeholder="••••••••" />

    <label class="field">TUYA_ENDPOINT</label>
    <input id="k_TUYA_ENDPOINT" />

    <label class="field">TUYA_PROJECT_CODE</label>
    <input id="k_TUYA_PROJECT_CODE" />

    <label class="field">ID датчика температуры</label>
    <input id="k_TUYA_TEMP_DEVICE_ID" />

    <label class="field">ID LED-ленты</label>
    <input id="k_TUYA_LED_DEVICE_ID" />

    <label class="field">ID дверного звонка</label>
    <input id="k_TUYA_DOORBELL_DEVICE_ID" />

    <div class="row">
      <div>
        <label class="field">Интервал, мин</label>
        <input id="k_SYNC_INTERVAL_MINUTES" type="number" min="1" />
      </div>
      <div>
        <label class="field">Масштаб температуры</label>
        <select id="k_TUYA_TEMP_SCALE">
          <option value="auto">auto</option>
          <option value="1">1</option>
          <option value="10">10</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <label class="field">Код яркости</label>
    <select id="k_TUYA_BRIGHT_CODE">
      <option value="auto">auto</option>
      <option value="bright_value">bright_value</option>
      <option value="bright_value_v2">bright_value_v2</option>
    </select>

    <button onclick="saveKeys()">Сохранить ключи</button>
    <div class="row">
      <button class="secondary" onclick="checkHealth()">Проверить подключение</button>
      <button onclick="syncNow()">Синхронизировать сейчас</button>
    </div>

    <div class="kv" id="bridgeState"></div>
    <pre class="logs" id="bridgeLogs"></pre>
    <p class="muted">На Koyeb файловая система стирается при деплое — постоянные значения держите в переменных окружения.</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var adminPassword = '';
    var KEY_FIELDS = ['TUYA_CLIENT_ID','TUYA_CLIENT_SECRET','TUYA_ENDPOINT','TUYA_PROJECT_CODE',
      'TUYA_TEMP_DEVICE_ID','TUYA_LED_DEVICE_ID','TUYA_DOORBELL_DEVICE_ID',
      'SYNC_INTERVAL_MINUTES','TUYA_TEMP_SCALE','TUYA_BRIGHT_CODE'];

    function verifyAdmin() {
      adminPassword = (document.getElementById('adminPassword').value || '').trim();
      fetch('/api/admin/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
      }).then(function(r){
        if (!r.ok) throw new Error('auth');
        return fetch('/api/settings');
      }).then(function(r){ return r.json(); }).then(function(settings){
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('panelCard').classList.remove('hidden');
        document.getElementById('bridgeCard').classList.remove('hidden');
        document.getElementById('requirePin').checked = !!settings.requireDashboardPin;
        document.getElementById('dashboardPin').value = settings.dashboardPin || '';
        loadKeys();
        loadState();
        loadLogs();
        connectSocket();
      }).catch(function(){
        document.getElementById('loginError').classList.remove('hidden');
      });
    }

    function savePinConfig() {
      var requireDashboardPin = document.getElementById('requirePin').checked;
      var dashboardPin = (document.getElementById('dashboardPin').value || '').trim();
      fetch('/api/admin/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, requireDashboardPin: requireDashboardPin, dashboardPin: dashboardPin })
      }).then(function(r){
        if (!r.ok) return r.json().then(function(data){ throw new Error(data.error || 'save error'); });
        return r.json();
      }).then(function(){
        document.getElementById('saveStatus').textContent = 'Сохранено';
      }).catch(function(err){
        document.getElementById('saveStatus').textContent = err.message;
      });
    }

    // ---------- Мост ----------
    function loadKeys() {
      fetch('/api/settings/keys').then(function(r){ return r.json(); }).then(function(data){
        var keys = (data && data.keys) || {};
        KEY_FIELDS.forEach(function(key){
          var el = document.getElementById('k_' + key);
          if (!el) return;
          if (key === 'TUYA_CLIENT_SECRET') { el.placeholder = keys[key] || '••••••••'; return; }
          el.value = keys[key] || '';
        });
      }).catch(function(){});
    }

    function saveKeys() {
      var payload = { password: adminPassword };
      KEY_FIELDS.forEach(function(key){
        var el = document.getElementById('k_' + key);
        if (!el) return;
        var value = (el.value || '').trim();
        if (key === 'TUYA_CLIENT_SECRET' && !value) return; // не затираем секрет
        payload[key] = value;
      });

      fetch('/api/settings/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function(r){ return r.json(); }).then(function(data){
        appendLog(data.success ? 'Ключи сохранены' : ('Ошибка: ' + (data.error || '')));
        loadKeys();
      }).catch(function(err){ appendLog('Ошибка сохранения: ' + err.message); });
    }

    function checkHealth() {
      appendLog('Проверка подключения…');
      fetch('/api/bridge/health').then(function(r){ return r.json(); }).then(function(data){
        var tuya = data.tuya || {};
        appendLog('Tuya: ' + (tuya.ok ? 'OK (' + tuya.latencyMs + ' мс)' : 'ОШИБКА — ' + tuya.error));
        Object.keys(data.devices || {}).forEach(function(name){
          var d = data.devices[name];
          appendLog('  ' + name + ': ' + (d.ok ? ((d.name || d.deviceId) + (d.online ? ' — online' : ' — offline')) : ('ОШИБКА — ' + d.error)));
        });
        setDot(Boolean(tuya.ok));
      }).catch(function(err){ appendLog('Ошибка проверки: ' + err.message); });
    }

    function syncNow() {
      appendLog('Запуск синхронизации…');
      fetch('/api/sync/now', { method: 'POST' }).then(function(r){ return r.json(); }).then(function(data){
        if (data.state) renderState(data.state);
        setDot(data.success !== false);
      }).catch(function(err){ appendLog('Ошибка синхронизации: ' + err.message); });
    }

    function loadState() {
      fetch('/api/bridge/status').then(function(r){ return r.json(); }).then(renderState).catch(function(){});
    }

    function loadLogs() {
      fetch('/api/bridge/logs?limit=80').then(function(r){ return r.json(); }).then(function(data){
        (data.logs || []).forEach(function(entry){ appendLog(entry.message, entry.ts); });
      }).catch(function(){});
    }

    function setDot(ok) {
      document.getElementById('bridgeDot').classList.toggle('ok', Boolean(ok));
    }

    function fmt(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString('ru-RU'); } catch (e) { return iso; }
    }

    function renderState(state) {
      if (!state) return;
      var temp = state.temperature || {};
      var led = state.led || {};
      var bell = state.doorbell || {};
      document.getElementById('bridgeSummary').textContent =
        'Синхронизация каждые ' + (state.intervalMinutes || '?') + ' мин.';
      document.getElementById('bridgeState').innerHTML =
        'Температура: <b>' + (temp.value !== null && temp.value !== undefined ? temp.value + '\u00b0C' : '—') + '</b><br>' +
        'Лента: <b>' + (led.on === null || led.on === undefined ? '—' : (led.on ? 'вкл' : 'выкл')) +
        (led.level !== null && led.level !== undefined ? ', ' + led.level + '%' : '') + '</b><br>' +
        'Звонок: <b>' + (bell.updatedAt ? fmt(bell.updatedAt) : 'кадров нет') + '</b><br>' +
        'Последняя удачная синхронизация: <b>' + fmt(state.lastSuccessAt) + '</b>' +
        (state.lastError ? '<br><span style="color:#f87171;">' + state.lastError + '</span>' : '');
      setDot(!state.lastError && state.lastSuccessAt);
    }

    function appendLog(message, ts) {
      var box = document.getElementById('bridgeLogs');
      var time = ts ? new Date(ts).toLocaleTimeString('ru-RU') : new Date().toLocaleTimeString('ru-RU');
      box.textContent += '[' + time + '] ' + message + '\n';
      box.scrollTop = box.scrollHeight;
    }

    function connectSocket() {
      if (typeof io !== 'function') return;
      var socket = io();
      socket.on('bridge-log', function(entry){ appendLog(entry.message, entry.ts); });
      socket.on('bridge-update', renderState);
    }
  </script>
</body>
</html>
