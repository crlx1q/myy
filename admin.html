<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b0b0b; color:#fff; margin:0; padding:24px; }
    .card { max-width:560px; margin:30px auto; background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:20px; }
    input,button,select { width:100%; box-sizing:border-box; margin-top:10px; padding:12px; border-radius:8px; border:1px solid #333; }
    input,select { background:#111; color:#fff; }
    button { background:#2563eb; color:#fff; border:none; cursor:pointer; }
    button.secondary { background:#374151; }
    .hidden { display:none; }
    .muted { color:#aaa; font-size:12px; }
    .row { display:flex; gap:10px; }
    .row button { flex:1; }
    label.field { display:block; margin-top:14px; font-size:13px; color:#ddd; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#6b7280; margin-right:6px; vertical-align:middle; }
    .dot.ok { background:#22c55e; }
    .dot.bad { background:#ef4444; }
    #tuyaLogs { background:#050505; border:1px solid #333; border-radius:8px; padding:10px; margin-top:12px;
                font-family:monospace; font-size:11px; white-space:pre-wrap; max-height:220px; overflow:auto; color:#cbd5e1; }
  </style>
</head>
<body>
  <div class="card" id="loginCard">
    <h2>Админ панель</h2>
    <p class="muted">Введите пароль администратора.</p>
    <input id="adminPassword" type="password" placeholder="Пароль" />
    <button onclick="verifyAdmin()">Войти</button>
    <p id="loginError" class="muted hidden" style="color:#f87171;">Неверный пароль</p>
  </div>

  <div class="card hidden" id="panelCard">
    <h2>Безопасность дашборда</h2>
    <label><input id="requirePin" type="checkbox" style="width:auto; margin-right:8px;">Требовать PIN для Index / Index Mini</label>
    <input id="dashboardPin" type="password" inputmode="numeric" placeholder="PIN-код" />
    <button onclick="savePinConfig()">Сохранить</button>
    <p id="saveStatus" class="muted"></p>
  </div>

  <div class="card hidden" id="tuyaCard">
    <h2>Tuya Cloud</h2>
    <p class="muted">Устройства дашборда берутся из Tuya (Smart Life). Пустое поле = значение из переменных окружения / кода.</p>
    <p id="tuyaState"><span class="dot" id="tuyaDot"></span><span id="tuyaStateText" class="muted">состояние неизвестно</span></p>

    <label class="field">Client ID (Access ID)</label>
    <input id="TUYA_CLIENT_ID" type="text" placeholder="Access ID проекта" />

    <label class="field">Client Secret (Access Secret)</label>
    <input id="TUYA_CLIENT_SECRET" type="password" placeholder="оставь пустым, чтобы не менять" />

    <label class="field">Дата-центр (endpoint)</label>
    <select id="TUYA_ENDPOINT">
      <option value="https://openapi.tuyaeu.com">Europe — openapi.tuyaeu.com</option>
      <option value="https://openapi.tuyaus.com">America — openapi.tuyaus.com</option>
      <option value="https://openapi.tuyacn.com">China — openapi.tuyacn.com</option>
      <option value="https://openapi.tuyain.com">India — openapi.tuyain.com</option>
    </select>

    <label class="field">UID аккаунта Smart Life (все устройства аккаунта)</label>
    <input id="TUYA_UID" type="text" placeholder="eu16... (необязательно)" />

    <label class="field">Датчик температуры — device_id</label>
    <input id="TUYA_TEMP_DEVICE_ID" type="text" />

    <label class="field">Лампа / лента — device_id</label>
    <input id="TUYA_LED_DEVICE_ID" type="text" />

    <label class="field">Дверной звонок — device_id</label>
    <input id="TUYA_DOORBELL_DEVICE_ID" type="text" />

    <label class="field">Датчик дыма — device_id</label>
    <input id="TUYA_SMOKE_DEVICE_ID" type="text" placeholder="если пусто — ищется автоматически" />

    <label class="field">Другие устройства (device_id через запятую)</label>
    <input id="TUYA_DEVICE_IDS" type="text" />

    <label class="field">Делитель температуры</label>
    <select id="TUYA_TEMP_SCALE">
      <option value="auto">auto — определять автоматически</option>
      <option value="1">1 — значение как есть</option>
      <option value="10">10 — 288 → 28.8</option>
      <option value="100">100 — 2880 → 28.8</option>
    </select>

    <button onclick="saveTuyaKeys()">Сохранить ключи</button>
    <div class="row">
      <button class="secondary" onclick="checkTuya()">Проверить подключение</button>
      <button class="secondary" onclick="resyncTuya()">Обновить устройства</button>
    </div>
    <p id="tuyaStatus" class="muted"></p>
    <div id="tuyaLogs">Логи Tuya появятся здесь…</div>
  </div>

  <script>
    var adminPassword = '';
    var TUYA_FIELDS = ['TUYA_CLIENT_ID','TUYA_CLIENT_SECRET','TUYA_ENDPOINT','TUYA_UID',
                       'TUYA_TEMP_DEVICE_ID','TUYA_LED_DEVICE_ID','TUYA_DOORBELL_DEVICE_ID',
                       'TUYA_SMOKE_DEVICE_ID','TUYA_DEVICE_IDS','TUYA_TEMP_SCALE'];
    var logsTimer = null;

    function verifyAdmin() {
      adminPassword = (document.getElementById('adminPassword').value || '').trim();
      fetch('/api/admin/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
      }).then(function(r){
        if (!r.ok) throw new Error('auth');
        return fetch('/api/settings');
      }).then(function(r){ return r.json(); }).then(function(settings){
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('panelCard').classList.remove('hidden');
        document.getElementById('tuyaCard').classList.remove('hidden');
        document.getElementById('requirePin').checked = !!settings.requireDashboardPin;
        document.getElementById('dashboardPin').value = settings.dashboardPin || '';
        loadTuyaKeys();
        refreshTuyaStatus();
        if (!logsTimer) logsTimer = setInterval(refreshTuyaStatus, 10000);
      }).catch(function(){
        document.getElementById('loginError').classList.remove('hidden');
      });
    }

    function savePinConfig() {
      var requireDashboardPin = document.getElementById('requirePin').checked;
      var dashboardPin = (document.getElementById('dashboardPin').value || '').trim();
      fetch('/api/admin/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, requireDashboardPin: requireDashboardPin, dashboardPin: dashboardPin })
      }).then(function(r){
        if (!r.ok) return r.json().then(function(data){ throw new Error(data.error || 'save error'); });
        return r.json();
      }).then(function(){
        document.getElementById('saveStatus').textContent = 'Сохранено';
      }).catch(function(err){
        document.getElementById('saveStatus').textContent = err.message;
      });
    }

    function loadTuyaKeys() {
      fetch('/api/tuya/keys?password=' + encodeURIComponent(adminPassword))
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.success) return;
          TUYA_FIELDS.forEach(function(key){
            var el = document.getElementById(key);
            if (!el) return;
            if (key === 'TUYA_CLIENT_SECRET') {
              el.placeholder = data.keys[key] ? ('сейчас: ' + data.keys[key]) : 'не задан';
              return;
            }
            el.value = data.keys[key] || '';
          });
        });
    }

    function saveTuyaKeys() {
      var payload = { password: adminPassword };
      TUYA_FIELDS.forEach(function(key){
        var el = document.getElementById(key);
        if (el) payload[key] = (el.value || '').trim();
      });
      document.getElementById('tuyaStatus').textContent = 'Сохраняю…';
      fetch('/api/tuya/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function(r){ return r.json(); }).then(function(data){
        if (!data.success) throw new Error(data.error || 'ошибка сохранения');
        document.getElementById('TUYA_CLIENT_SECRET').value = '';
        document.getElementById('tuyaStatus').textContent = 'Ключи сохранены, переподключаюсь…';
        loadTuyaKeys();
        setTimeout(checkTuya, 1500);
      }).catch(function(err){
        document.getElementById('tuyaStatus').textContent = 'Ошибка: ' + err.message;
      });
    }

    function checkTuya() {
      document.getElementById('tuyaStatus').textContent = 'Проверяю подключение…';
      fetch('/api/tuya/health', { method: 'POST' })
        .then(function(r){ return r.json(); })
        .then(function(data){
          setDot(data.ok);
          document.getElementById('tuyaStatus').textContent = data.ok
            ? ('Подключение в порядке. Устройств: ' + data.devices + ' (' + data.tookMs + ' мс)')
            : ('Не подключилось: ' + data.error);
          refreshTuyaStatus();
        }).catch(function(err){
          setDot(false);
          document.getElementById('tuyaStatus').textContent = 'Ошибка: ' + err.message;
        });
    }

    function resyncTuya() {
      document.getElementById('tuyaStatus').textContent = 'Обновляю список устройств…';
      fetch('/api/tuya/refresh', { method: 'POST' })
        .then(function(r){ return r.json(); })
        .then(function(data){
          document.getElementById('tuyaStatus').textContent = data.success
            ? ('Готово. Устройств на дашборде: ' + data.devices)
            : ('Ошибка: ' + data.error);
          refreshTuyaStatus();
        });
    }

    function setDot(ok) {
      var dot = document.getElementById('tuyaDot');
      dot.className = 'dot ' + (ok ? 'ok' : 'bad');
    }

    function refreshTuyaStatus() {
      fetch('/api/tuya/status').then(function(r){ return r.json(); }).then(function(data){
        var cloud = data.cloud || {};
        setDot(!cloud.lastError && data.devices > 0);
        document.getElementById('tuyaStateText').textContent =
          'устройств: ' + data.devices +
          ' • токен: ' + (cloud.hasToken ? 'есть' : 'нет') +
          (cloud.uid ? (' • uid: ' + cloud.uid) : '') +
          (cloud.lastError ? (' • ' + cloud.lastError) : '');

        var logs = (data.logs || []).map(function(item){
          return '[' + new Date(item.at).toLocaleTimeString('ru-RU') + '] ' +
                 (item.level === 'error' ? '✖ ' : '• ') + item.message;
        }).join('\n');
        document.getElementById('tuyaLogs').textContent = logs || 'Пока логов нет.';
      }).catch(function(){});
    }
  </script>
</body>
</html>
